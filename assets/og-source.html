<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    background: #0b1220;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 90px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 36px;
  }
  .dot {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #22d3ee;
  }
  .brand strong {
    color: #e2e8f0;
    font-size: 24px;
    letter-spacing: 2px;
  }
  h1 {
    color: #e2e8f0;
    font-size: 56px;
    font-weight: 700;
    line-height: 1.25;
    max-width: 900px;
    margin-bottom: 24px;
  }
  h1 span { color: #22d3ee; }
  p {
    color: #94a3b8;
    font-size: 26px;
    max-width: 760px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><span class="dot"></span><strong>NEXO LABS</strong></div>
    <h1>Convertimos procesos manuales en <span>sistemas automatizados</span></h1>
    <p>Software a medida para negocios que quieren dejar el Excel (y el papel) atrás.</p>
  </div>
</body>
</html>
